name: App

# Builds and tests the SwiftUI app (P19), which only exists on macOS. The PR gate is lint and Linux, which never see the app, so a
# pull request that touches the app runs this one macOS job; every other pull request leaves the scarce macOS slots alone.
# On main the whole suite, the app's included, runs in the CI workflow's `build-test`.
on:
  pull_request:
    paths:
      - "Sources/WorkbenchApp/**"
      - "Tests/WorkbenchAppTests/**"
      - "Package.swift"
      - "Resources/**"
      - "scripts/bundle-app.sh"
      - "scripts/verify-app.sh"
      - "scripts/ax.swift"
      - "scripts/test-verify-app-ax.sh"
      - "scripts/test-verify-app-guard.sh"
      - "Fixtures/app/**"
      - "scripts/render-icon.sh"
      - "scripts/window-info.swift"
      - "scripts/app-icon.swift"
      - ".github/workflows/app.yml"
      - ".xcode-version"
      - ".github/actions/xcode/**"
      - "scripts/use-xcode.sh"
      - "scripts/test-bundle-app-guard.sh"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build the app
        run: swift build --product WorkbenchApp
      - name: Did the packaging change
        id: packaging
        # The bundle is a second, release-mode compile (about four minutes) whose checks are about the plist, the icon and the
        # signature, so it runs when those can have changed: the resources, the package, the scripts that make the bundle, this
        # file. A change to the app's Swift alone is compiled and tested by the steps around it, and the `release-build` workflow (a
        # label, and nightly) builds the app in release mode. A manual run always builds it.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PACKAGING: '^(Resources/|Package\.swift$|\.xcode-version$|scripts/(bundle-app|render-icon|use-xcode|test-bundle-app-guard)\.sh$|scripts/app-icon\.swift$|\.github/workflows/app\.yml$|\.github/actions/xcode/)'
        run: |
          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -Eq "$PACKAGING"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No packaging file changed: the bundle is not built."
          fi
      - name: Build the app bundle
        if: steps.packaging.outputs.changed == 'true'
        # The release build in a bundle, then the checks that need no screen: the plist lints, the icon has every size, the
        # signature holds. `--check` (launch it, find its window) needs a desktop session, so a person runs that one.
        run: scripts/bundle-app.sh
      - name: Test the accessibility helper's label rules
        # ax.swift on a fixture tree, with no window: an exact label beats a prefix, and a label is refused by the button it resolves to.
        run: scripts/test-verify-app-ax.sh
      - name: Test the app
        # The window renders go to a folder that is uploaded below, so a reviewer sees what each state looks like.
        env:
          WORKBENCH_RENDER_DIR: ${{ runner.temp }}/renders
        run: |
          set -o pipefail
          swift test --filter WorkbenchAppTests 2>&1 | tee app-test.log
      - name: Upload renders and log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-renders
          path: |
            ${{ runner.temp }}/renders/workbench-app-renders/*.png
            app-test.log
          if-no-files-found: ignore
          retention-days: 14
