name: Linux probe

# Throwaway: does the package build and pass its tests on Linux, and how long does it take next to macOS?
on:
  workflow_dispatch:
  push:
    branches: [probe/linux-build]

# A new push supersedes the run before it on the same ref, as in ci.yml.
concurrency:
  group: linux-probe-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: swift:6.2.1
      # An init as PID 1 reaps orphans, as launchd does on macOS; without one they stay zombies and `kill(pid, 0)` still succeeds.
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          nproc
          git --version
      - name: Git identity and python3 (the tests commit, and two of them run a python server)
        # System scope, not --global: Foundation's NSHomeDirectory() is /root here while HOME is /github/home.
        run: |
          git config --system user.name "Workbench CI"
          git config --system user.email "ci@example.invalid"
          apt-get update -qq && apt-get install -y -qq python3
      - name: Build
        run: |
          set -o pipefail
          time swift build 2>&1 | tee build.log
      - name: Test
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          time swift test 2>&1 | tee test.log
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-probe-logs
          path: |
            build.log
            test.log
