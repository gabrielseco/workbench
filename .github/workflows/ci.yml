name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Runner hardware
        run: |
          echo "cores: $(sysctl -n hw.ncpu)"
          sw_vers
          swift --version
      - name: Banned process APIs
        run: scripts/check-banned-apis.sh
      - name: SwiftLint
        run: |
          command -v swiftlint || brew install swiftlint
          swiftlint lint --quiet
      - name: Timing script check
        run: scripts/test-timings-check.sh
      - name: Build
        run: swift build
      - name: Test
        # tee keeps the log for the timings below; pipefail keeps swift's exit code.
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Soak (100 fake runs, failure matrix, no leaks)
        # Its own step, so descriptor counts are not disturbed by other suites running alongside.
        run: |
          set -o pipefail
          WORKBENCH_SOAK=1 swift test --filter SoakTests 2>&1 | tee soak.log
        timeout-minutes: 15
      - name: Test leftovers
        # The tests remove their scratch directory at exit; a root left behind is a leak.
        run: scripts/check-test-leftovers.sh
      - name: Test timings
        # Also after a failure: that is when the log matters. scripts/ci-report.sh reads the artifact.
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/test-timings.py test.log --json timings.json --markdown timings.md || true
          [ -f timings.md ] && cat timings.md >> "$GITHUB_STEP_SUMMARY"
          true
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test.log
            soak.log
            timings.json
            timings.md
          if-no-files-found: ignore
          retention-days: 14

  # The unit tests only run in debug, and a release build of the same source has behaved differently (Swift's simplify-cfg pass
  # miscompiled async code: a Claude review was refused in release only; docs/swift-bugs/, Package.swift). This builds the optimized
  # binary and runs the free scenarios (a fake claude and a fake codex, no money) on it. A separate job, so it adds no time to the first.
  release-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.1 (Swift 6.2.1)
        # The runner's default Xcode has Swift 6.1.2, which predates the simplify-cfg bug (docs/swift-bugs/), so CI could not see it.
        run: sudo xcode-select -s /Applications/Xcode_26.1.app
      - name: Toolchain bug check (informational)
        # Says whether this Swift still has the bug Package.swift works around; never fails the job on its own answer.
        run: scripts/swift-bug-repro.sh || true
      - name: Release build with every optimizer pass verified
        # The compiler checks its own intermediate code after each pass and aborts on invalid code: that is how the bug was found, and
        # it catches the next one in any function, with no scenario needed to reach it. About two minutes.
        run: swift build -c release --product workbench -Xswiftc -Xfrontend -Xswiftc -sil-verify-all
      - name: Git identity (the scenarios commit)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Review on Claude, release build
        run: VERIFY_CLI_CI=1 VERIFY_CLI_BUILD=release scripts/verify-cli/claude-review.sh
      - name: Run on Codex, release build
        run: VERIFY_CLI_CI=1 VERIFY_CLI_BUILD=release scripts/verify-cli/run-codex.sh

