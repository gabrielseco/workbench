name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Banned process APIs
        run: scripts/check-banned-apis.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
