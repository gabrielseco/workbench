name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A new push supersedes the run before it on the same ref; main runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Nothing here needs macOS, and GitHub caps concurrent macOS jobs far below Linux ones, so these checks stay off the macOS slot.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Banned process APIs
        run: scripts/check-banned-apis.sh
      - name: The banned-APIs check refuses what it must
        # The bare TextEditor( rule, on trees of its own: no build and no screen.
        run: scripts/test-banned-apis.sh
      - name: UI tokens
        # A view takes radius, type, spacing and shapes from a component or a token: any literal outside the component files fails.
        run: scripts/check-ui-tokens.sh
      - name: The UI-tokens check refuses what it must
        run: scripts/test-ui-tokens.sh
      - name: SwiftLint binary (cached)
        # Pinned to the version developers run locally; the static Linux binary needs no Swift toolchain. It is restored from the cache,
        # so a run does not depend on GitHub's release host being up (a 504 there failed the job twice). A new version is a new key.
        id: swiftlint
        uses: actions/cache@v4
        with:
          path: ~/swiftlint-0.65.1
          key: swiftlint-0.65.1-linux-amd64
      - name: Download SwiftLint (only when it is not cached)
        if: steps.swiftlint.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          unzip -q swiftlint.zip -d ~/swiftlint-0.65.1
      - name: SwiftLint
        run: ~/swiftlint-0.65.1/swiftlint lint --quiet
      - name: Timing script check
        run: scripts/test-timings-check.sh
      - name: App bundle script refuses off macOS
        # bundle-app.sh builds a macOS app: on Linux it must say no clearly and change nothing (the app job runs it for real).
        run: scripts/test-bundle-app-guard.sh
      - name: App verify script refuses what it must
        # verify-app.sh drives a macOS app: its refusals (a pid it did not start, a scenario name that reaches outside Fixtures/app/)
        # need no macOS tool, and this test cannot start anything even if a guard is broken.
        run: scripts/test-verify-app-guard.sh

  # macOS is no longer the PR gate (the Linux workflow is, P18): it holds one of the scarce macOS slots, so it runs nightly and by hand (the `macos-test` label runs it on a PR).
  build-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode
      - name: Runner hardware
        run: |
          echo "cores: $(sysctl -n hw.ncpu)"
          sw_vers
          swift --version
      - name: Build
        run: swift build
      - name: Test
        # tee keeps the log for the timings below; pipefail keeps swift's exit code.
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Soak (100 fake runs, failure matrix, no leaks)
        # Its own step, so descriptor counts are not disturbed by other suites running alongside.
        run: |
          set -o pipefail
          WORKBENCH_SOAK=1 swift test --filter SoakTests 2>&1 | tee soak.log
        timeout-minutes: 15
      - name: Test leftovers
        # The tests remove their scratch directory at exit; a root left behind is a leak.
        run: scripts/check-test-leftovers.sh
      - name: Test timings
        # Also after a failure: that is when the log matters. scripts/ci-report.sh reads the artifact.
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/test-timings.py test.log --json timings.json --markdown timings.md || true
          [ -f timings.md ] && cat timings.md >> "$GITHUB_STEP_SUMMARY"
          true
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test.log
            soak.log
            timings.json
            timings.md
          if-no-files-found: ignore
          retention-days: 14
