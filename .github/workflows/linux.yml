name: Linux

# Builds the package and runs the whole suite on Linux (P18). Not the PR gate yet: that is task 6.
# Also runs on pushes to main, which is what fills the build cache that pull requests start from.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    container:
      image: swift:6.2.1
      # An init as PID 1 reaps orphans, as launchd does on macOS; without one they stay zombies and `kill(pid, 0)` still succeeds.
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # All of history: the build restores each file's last commit time from it.
          fetch-depth: 0
      - uses: ./.github/actions/linux-build
        with:
          save-cache: "true"
      - name: Test
        # 16 permits: on a 4-core Linux runner the default (one per core) left the CPU 91% idle (docs/plan/P18-linux.md).
        run: |
          set -o pipefail
          runuser -u tester -- env "PATH=$PATH" WORKBENCH_TEST_PERMITS=16 swift test --skip-build 2>&1 | tee test.log
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: |
            build.log
            test.log

  # Its own job, in its own container: it counts the processes left on the machine ("no `sleep 300`"), so no other
  # suite may run beside it, and it runs at the same time as `test`, so it costs no wall time.
  soak:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: swift:6.2.1
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/linux-build
      - name: Soak (100 fake runs, failure matrix, no leaks)
        run: |
          set -o pipefail
          runuser -u tester -- env "PATH=$PATH" WORKBENCH_SOAK=1 swift test --skip-build --filter SoakTests 2>&1 | tee soak.log
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-soak-logs
          path: |
            build.log
            soak.log
