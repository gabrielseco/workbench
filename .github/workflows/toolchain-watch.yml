name: Toolchain watch

# Weekly, and when the workaround or its case changes. The Swift on the runner image can change under us: this says when the
# optimizer bug that Package.swift works around is fixed (the run fails, so the owner is told: remove the workaround), and checks
# that a release build with every optimizer pass verified still compiles clean on whatever Swift the runner has now.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Package.swift
      - docs/swift-bugs/**
      - scripts/swift-bug-repro.sh
      - .github/workflows/toolchain-watch.yml

jobs:
  watch:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.1 (Swift 6.2.1)
        # The runner's default Xcode has Swift 6.1.2, which predates the simplify-cfg bug (docs/swift-bugs/), so CI could not see it.
        run: sudo xcode-select -s /Applications/Xcode_26.1.app
      - name: Swift version
        run: swiftc --version
      - name: Is the workaround still needed?
        # Exit 3 means a compiler at least as new as the one the bug was found on (6.2.1) no longer has it: remove the flag from
        # Package.swift and this workflow. An older runner Swift prints "not applicable" and passes.
        run: scripts/swift-bug-repro.sh --fail-when-fixed
      - name: Release build with every optimizer pass verified
        run: swift build -c release --product workbench -Xswiftc -Xfrontend -Xswiftc -sil-verify-all
