name: Linux dispatch stress (fix)

# Throwaway: which Dispatch mechanism crashes libdispatch on Linux under heavy concurrency?
on:
  workflow_dispatch:
  push:
    branches: [probe/linux-stress-fix]

concurrency:
  group: linux-stress-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipe-1:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: swift:6.2.1
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Stress pipe
        run: |
          set +e
          WORKBENCH_STRESS=pipe WORKBENCH_STRESS_SECONDS=240 swift test --filter DispatchStressTests 2>&1 | tee stress.log
          echo "exit: ${PIPESTATUS[0]}"
          grep -E "STRESS_DONE|Program crashed|_dispatch_event_loop_drain" stress.log | head -5
      - name: Upload log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: stress-pipe-1
          path: stress.log
